name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & Test
        run: mvn -q -B test

      - name: Checkstyle
        run: mvn -q -B checkstyle:check
        continue-on-error: true

      - name: Run example
        run: |
          mvn -q -B compile
          mkdir -p target/example
          javac -cp target/classes -d target/example example/Example.java
          java -cp target/classes:target/example example.Example
